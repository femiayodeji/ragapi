[project]
name = "ragapi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai>=1.54.0",
    "chromadb>=0.4.22",
    "pypdf>=3.17.4",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "faster-whisper>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.3",
]
